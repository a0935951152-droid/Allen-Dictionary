<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CAG 變體管理</title>
<style>
  :root{--line:#e3e3e3;--muted:#888;--blue:#2d8cf0;--red:#e84545;--green:#39b54a}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;color:#222;background:#fafafa}
  header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 14px;
    border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0 8px 0 0}
  header .sub{font-size:12px;color:var(--muted)}
  .navlink{padding:3px 10px;border:1px solid var(--blue);border-radius:6px;color:var(--blue);font-size:13px;white-space:nowrap;text-decoration:none}
  .navlink:hover{background:#f0f6ff}
  input,button{font:inherit}
  #q{padding:4px 8px;border:1px solid var(--line);border-radius:6px;width:200px}
  #list{max-width:920px;margin:14px auto;padding:0 12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:9px}
  .card.dirty{border-color:#f0c36d;background:#fffdf5}
  .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .term{font-weight:600;font-size:15px}
  .meta{font-size:11px;color:var(--muted)}
  .tag{display:inline-flex;align-items:center;gap:4px;background:#eef4ff;border:1px solid #d6e4ff;
    border-radius:12px;padding:1px 4px 1px 9px;font-size:13px;margin:3px 4px 0 0}
  .tag b{cursor:pointer;color:var(--red);font-weight:700;padding:0 3px;border-radius:8px}
  .tag b:hover{background:#ffe0e0}
  .vars{margin-top:5px}
  .add{border:1px dashed #bbb;border-radius:12px;padding:1px 8px;font-size:13px;width:90px;outline:none}
  .save{margin-left:6px;border:none;background:var(--blue);color:#fff;border-radius:6px;padding:3px 12px;cursor:pointer;font-size:12px}
  .save:disabled{opacity:.4;cursor:default}
  .save.ok{background:var(--green)}
  .op{font-size:12px;padding:2px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
  .op:hover{border-color:var(--blue)}.op.danger{color:var(--red);border-color:#f0b8b8}
  .empty{color:var(--muted);font-size:13px}
  .hint{max-width:920px;margin:10px auto 0;padding:0 12px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>CAG 變體管理</h1>
  <a href="/graph.html" class="navlink">← 回心智圖</a>
  <input id="q" placeholder="搜尋正解詞…"/>
  <label class="sub"><input type="checkbox" id="onlysp" checked/> 只看 CAG(is_special)</label>
  <span class="sub" id="stat"></span>
</header>
<div class="hint">變體＝該正解的 ASR 誤聽寫法。刪掉雜訊變體（點 ×）或新增（輸入後 Enter）→ 存檔。存後該詞鎖定，知識庫重建不會覆蓋；聲學索引即時刷新。</div>
<div id="list"></div>

<script>
const $=s=>document.querySelector(s);
let DATA=[];
async function load(){
  const sp=$('#onlysp').checked;
  const r=await fetch(`/api/cag/variants?only_special=${sp}`,{cache:'no-store'});
  DATA=await r.json();
  render();
}
function render(){
  const q=$('#q').value.trim();
  const rows=DATA.filter(r=>!q||r.term.includes(q));
  $('#stat').textContent=`${rows.length} 詞 · ${rows.reduce((a,r)=>a+r.variants.length,0)} 變體`;
  const el=$('#list'); el.innerHTML='';
  for(const r of rows){
    const card=document.createElement('div');
    card.className='card'+(r.variants.length>=6?' dirty':'');
    card.innerHTML=`<div class="row1"><span class="term">${esc(r.term)}</span>
      <span class="meta">${esc(r.category||'')} · ${esc(r.tier||'')} · ${r.variants.length} 變體</span>
      <span style="margin-left:auto;display:flex;gap:6px">
        <button class="op" data-op="rename">✎ 改正解</button>
        <button class="op" data-op="exclude">⊘ 移出 CAG</button>
        <button class="op danger" data-op="del">🗑</button></span></div>
      <div class="vars"></div>`;
    card.querySelectorAll('.op').forEach(b=>b.onclick=()=>termOp(r.term, b.dataset.op));
    const vbox=card.querySelector('.vars');
    let vs=[...r.variants];
    const paint=()=>{
      vbox.innerHTML='';
      if(!vs.length) vbox.innerHTML='<span class="empty">（無變體）</span> ';
      vs.forEach((v,i)=>{
        const t=document.createElement('span'); t.className='tag';
        t.innerHTML=`${esc(v)}<b title="刪除">×</b>`;
        t.querySelector('b').onclick=()=>{vs.splice(i,1);paint();dirty();};
        vbox.appendChild(t);
      });
      const inp=document.createElement('input'); inp.className='add'; inp.placeholder='+ 新增';
      inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()){vs.push(inp.value.trim());inp.value='';paint();dirty();}};
      vbox.appendChild(inp);
      const btn=document.createElement('button'); btn.className='save'; btn.textContent='存檔'; btn.disabled=true;
      btn.onclick=async()=>{
        btn.disabled=true;btn.textContent='存…';
        const rr=await fetch(`/api/cag/variants/${encodeURIComponent(r.term)}`,
          {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({variants:vs})});
        const j=await rr.json(); vs=j.variants||vs; r.variants=vs;
        btn.className='save ok';btn.textContent='已存✓';setTimeout(()=>{btn.className='save';btn.textContent='存檔';},1500);
        paint();
      };
      vbox.appendChild(btn);
      card._btn=btn;
    };
    const dirty=()=>{card._btn&&(card._btn.disabled=false);};
    paint();
    el.appendChild(card);
  }
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function termOp(term,op){
  const u=`/api/cag/terms/${encodeURIComponent(term)}`;
  if(op==='rename'){const nv=prompt('改正解（重命名，鎖定）：\n'+term+' →',term);if(!nv||!nv.trim()||nv.trim()===term)return;
    await fetch(u,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({correct:nv.trim()})});}
  else if(op==='exclude'){if(!confirm(`「${term}」移出 CAG？\n（不再進聲學索引/校正，仍留心智圖；鎖定，build 不還原）`))return;
    await fetch(u,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_special:false})});}
  else if(op==='del'){if(!confirm(`刪除「${term}」心智圖節點？\n⚠ 來源仍在時 build 可能重抽；持久排除請用「移出 CAG」。`))return;
    await fetch(u,{method:'DELETE'});}
  await load();
}
$('#q').oninput=render; $('#onlysp').onchange=load;
load();
</script>
</body>
</html>
